<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask on Azure App Service</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 600px;
            margin: 60px auto;
            padding: 0 20px;
            line-height: 1.6;
            color: #222;
        }
        form {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            padding: 8px 12px;
            font-size: 16px;
            flex: 1;
        }
        button {
            padding: 8px 16px;
            font-size: 16px;
            background-color: #0078d4;
            color: white;
            border: none;
            cursor: pointer;
        }
        .response {
            margin-top: 20px;
            padding: 12px;
            background-color: #f0f6ff;
            border-left: 4px solid #0078d4;
        }
    </style>
</head>
<body>
    <h1>Welcome to Flask on Azure</h1>
    <p>Enter your name below to test form handling on Azure App Service.</p>

    <form method="POST">
        <input type="text" name="name" placeholder="Your name" required>
        <button type="submit">Submit</button>
    </form>

    {% if message %}
    <div class="response">
        <strong>{{ message }}</strong>
    </div>
    {% endif %}
</body>
</html>
